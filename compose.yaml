services:
  postgres:
    image: postgres:16
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev
      POSTGRES_DB: pulsewatch
    ports:
      - "5433:5432"
    volumes:
      - pulsewatch_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  pulsewatch_data:
  redis_data:
